name: Server deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 公開先（DBの既存データは保持する）
        type: choice
        required: true
        options: [dev, prod]
  pull_request:
    types: [closed]
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: >-
    server-deploy-${{
      github.event_name == 'workflow_dispatch' && inputs.environment ||
      (github.event.pull_request.base.ref == 'main' && 'prod' || 'dev')
    }}
  cancel-in-progress: false

jobs:
  verify:
    name: Build and test
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: server/.node-version
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: server/package.json
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:ci
      - run: node scripts/artifact.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: server-worker
          path: |
            server/dist/index.js
            server/dist/index.js.map
            server/dist/build-info.json
            server/dist/migrations/*.sql
          if-no-files-found: error
          retention-days: 7
  deploy:
    name: >-
      Deploy ${{
        github.event_name == 'workflow_dispatch' && inputs.environment ||
        (github.event.pull_request.base.ref == 'main' && 'prod' || 'dev')
      }}
    needs: verify
    if: needs.verify.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: >-
        server-${{
          github.event_name == 'workflow_dispatch' && inputs.environment ||
          (github.event.pull_request.base.ref == 'main' && 'prod' || 'dev')
        }}
      url: ${{ steps.deploy.outputs.url }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: server/.node-version
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: server/package.json
          run_install: false
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: server-worker
          path: server/.wrangler/artifact
      - name: Apply migrations and deploy
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          TARGET_ENVIRONMENT: >-
            ${{
              github.event_name == 'workflow_dispatch' && inputs.environment ||
              (github.event.pull_request.base.ref == 'main' && 'prod' || 'dev')
            }}
          SERVER_ARTIFACT_DIR: .wrangler/artifact
        run: node scripts/deploy.mjs deploy "$TARGET_ENVIRONMENT"
