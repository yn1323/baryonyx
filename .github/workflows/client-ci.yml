name: Client CI

on:
  push:
    branches:
      - main
    paths:
      - 'client/**'
      - '.github/workflows/client-ci.yml'
      - '.github/workflows/client-distribute.yml'
  pull_request:
    paths:
      - 'client/**'
      - '.github/workflows/client-ci.yml'
      - '.github/workflows/client-distribute.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: APKの配布名（アプリ内の接続先・署名は共通）
        type: choice
        required: true
        default: dev
        options: [dev, prod, preview]

env:
  APK_ENVIRONMENT: ${{ github.event_name == 'pull_request' && 'preview' || (github.event_name == 'workflow_dispatch' && inputs.environment || 'dev') }}

permissions:
  contents: read

concurrency:
  group: client-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci-scripts:
    name: Client CI scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test Drive uploader
        run: python3 -B -m unittest discover -s client/ci -p 'test_upload_drive_apk.py'
      - name: Test trusted distribution source selection
        run: node --test client/ci/resolve-drive-distribution.test.cjs
      - name: Test Unity CI helpers
        run: python3 -B -m unittest discover -s client/ci -p 'test_unity_ci.py'

  format:
    name: Client format (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: client/global.json
      - name: Restore CSharpier
        run: dotnet tool restore
      - name: Check C# formatting
        run: dotnet csharpier check Assets

  analyzers:
    name: Client analyzers
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check Unity prerequisites
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: bash client/ci/unity-preflight.sh
      - name: Restore Unity Library
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: client/Library
          key: client-Library-${{ runner.os }}-${{ env.UNITY_VERSION }}-${{ hashFiles('client/Packages/**', 'client/Assets/Analyzers/**', 'client/Assets/**/*.ruleset') }}-${{ github.sha }}
          restore-keys: |
            client-Library-${{ runner.os }}-${{ env.UNITY_VERSION }}-${{ hashFiles('client/Packages/**', 'client/Assets/Analyzers/**', 'client/Assets/**/*.ruleset') }}-
      - name: Prepare compiler report
        run: |
          # Cached PIDs belong to a previous container; Burst may kill a reused PID.
          rm -f -- client/Library/burst.pid client/Library/ilpp.pid
          mkdir -p client/Logs
          rm -f client/Logs/client-compile.txt
      - name: Compile Unity scripts and run analyzers
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00 # v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: client
          unityVersion: ${{ env.UNITY_VERSION }}
          customImage: unityci/editor:${{ env.UNITY_VERSION }}-base-3
          targetPlatform: StandaloneLinux64
          buildMethod: Baryonyx.Editor.CI.CompileCheck.Run
          manualExit: true
          customParameters: -nographics
          versioning: None
      - name: Verify compiler completion
        run: |
          grep -q '^BARYONYX_COMPILE_OK: ' client/Logs/client-compile.txt
      - name: Report runner resources after a failure
        if: failure()
        run: |
          free -m
          df -h
          sudo dmesg --level=err,warn | tail -n 40 || true
      - name: Upload compiler diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: client-compiler-diagnostics
          path: client/Logs/client-compile.txt
          if-no-files-found: ignore
          retention-days: 7

  tests:
    name: Client tests
    needs: analyzers
    runs-on: ubuntu-24.04
    # Each mode keeps its 30-minute limit, with time for setup and artifacts.
    timeout-minutes: 65
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check Unity prerequisites
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: bash client/ci/unity-preflight.sh
      - name: Restore Unity Library
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: client/Library
          key: client-tests-linux-il2cpp-combined-${{ env.UNITY_VERSION }}-${{ hashFiles('client/Packages/**', 'client/Assets/Analyzers/**', 'client/Assets/**/*.ruleset') }}-${{ github.sha }}
          restore-keys: |
            client-tests-linux-il2cpp-combined-${{ env.UNITY_VERSION }}-${{ hashFiles('client/Packages/**', 'client/Assets/Analyzers/**', 'client/Assets/**/*.ruleset') }}-
            client-tests-linux-il2cpp-editmode-${{ env.UNITY_VERSION }}-${{ hashFiles('client/Packages/**', 'client/Assets/Analyzers/**', 'client/Assets/**/*.ruleset') }}-
            client-tests-linux-il2cpp-playmode-${{ env.UNITY_VERSION }}-${{ hashFiles('client/Packages/**', 'client/Assets/Analyzers/**', 'client/Assets/**/*.ruleset') }}-
      - name: Restore GameCI CLI
        id: setup
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/baryonyx-game-ci
          key: game-ci-cli-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('client/ci/run-unity-tests.sh') }}
      - name: Run EditMode tests
        id: editmode
        timeout-minutes: 30
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: bash client/ci/run-unity-tests.sh editmode Baryonyx.EditModeTests
      - name: Require executed and passing EditMode tests
        if: ${{ !cancelled() && steps.editmode.outcome != 'skipped' }}
        run: python3 client/ci/verify-test-results.py client/TestResults/editmode Baryonyx.EditModeTests
      - name: Upload EditMode results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: client-tests-editmode
          path: client/TestResults/editmode
          if-no-files-found: ignore
          retention-days: 7
      - name: Run PlayMode tests
        id: playmode
        # A failed mode must not hide the other mode's results or become a success.
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        timeout-minutes: 30
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: bash client/ci/run-unity-tests.sh playmode Baryonyx.PlayModeTests
      - name: Require executed and passing PlayMode tests
        if: ${{ !cancelled() && steps.playmode.outcome != 'skipped' }}
        run: python3 client/ci/verify-test-results.py client/TestResults/playmode Baryonyx.PlayModeTests
      - name: Upload PlayMode results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: client-tests-playmode
          path: client/TestResults/playmode
          if-no-files-found: ignore
          retention-days: 7

  android-build:
    name: Client Android build
    outputs:
      artifact-id: ${{ steps.apk.outputs.artifact-id }}
    needs: [format, analyzers, tests, ci-scripts]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check Unity prerequisites
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: bash client/ci/unity-preflight.sh
      - name: Restore Android Library
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: client/Library
          key: client-Android-${{ env.UNITY_VERSION }}-${{ hashFiles('client/Packages/**', 'client/Assets/Analyzers/**', 'client/Assets/**/*.ruleset') }}-${{ github.sha }}
          restore-keys: |
            client-Android-${{ env.UNITY_VERSION }}-${{ hashFiles('client/Packages/**', 'client/Assets/Analyzers/**', 'client/Assets/**/*.ruleset') }}-
      - name: Remove stale Unity process IDs
        run: rm -f -- client/Library/burst.pid client/Library/ilpp.pid
      - name: Build Android APK
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00 # v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: client
          unityVersion: ${{ env.UNITY_VERSION }}
          customImage: unityci/editor:${{ env.UNITY_VERSION }}-android-3
          targetPlatform: Android
          buildMethod: Baryonyx.Editor.CI.AndroidBuild.Build
          buildsPath: client/Builds
          buildName: baryonyx
          androidTargetSdkVersion: 36
          androidSdkManagerParameters: platforms;android-36
          versioning: None
      - name: Upload Android APK
        id: apk
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: client-android-apk-${{ env.APK_ENVIRONMENT }}-${{ github.run_attempt }}
          path: client/Builds/Android/baryonyx.apk
          if-no-files-found: error
          retention-days: 7
