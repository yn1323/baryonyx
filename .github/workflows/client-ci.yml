name: Client CI

on:
  push:
    paths:
      - 'client/**'
      - '.github/workflows/client-ci.yml'
  pull_request:
    paths:
      - 'client/**'
      - '.github/workflows/client-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Client format (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: client/global.json
      - name: Restore CSharpier
        run: dotnet tool restore
      - name: Check C# formatting
        run: dotnet csharpier check Assets

  analyzers:
    name: Client analyzers
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check Unity prerequisites
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: bash client/ci/unity-preflight.sh
      - name: Restore Unity Library
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: client/Library
          key: client-Library-${{ runner.os }}-${{ env.UNITY_VERSION }}-${{ hashFiles('client/Packages/**', 'client/Assets/Analyzers/**', 'client/Assets/**/*.ruleset') }}-${{ github.sha }}
          restore-keys: |
            client-Library-${{ runner.os }}-${{ env.UNITY_VERSION }}-${{ hashFiles('client/Packages/**', 'client/Assets/Analyzers/**', 'client/Assets/**/*.ruleset') }}-
      - name: Prepare compiler report
        run: |
          mkdir -p client/Logs
          rm -f client/Logs/client-compile.txt
      - name: Compile Unity scripts and run analyzers
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00 # v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: client
          unityVersion: ${{ env.UNITY_VERSION }}
          customImage: unityci/editor:${{ env.UNITY_VERSION }}-base-3
          targetPlatform: StandaloneLinux64
          buildMethod: Baryonyx.Editor.CI.CompileCheck.Run
          manualExit: true
          versioning: None
      - name: Verify compiler completion
        run: |
          grep -q '^BARYONYX_COMPILE_OK: ' client/Logs/client-compile.txt
      - name: Upload compiler diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: client-compiler-diagnostics
          path: client/Logs/client-compile.txt
          if-no-files-found: ignore
          retention-days: 7

  tests:
    name: Client tests (${{ matrix.mode }})
    needs: analyzers
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - mode: editmode
            assembly: Baryonyx.EditModeTests
          - mode: playmode
            assembly: Baryonyx.PlayModeTests
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check Unity prerequisites
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: bash client/ci/unity-preflight.sh
      - name: Restore Unity Library
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: client/Library
          key: client-tests-${{ matrix.mode }}-${{ env.UNITY_VERSION }}-${{ hashFiles('client/Packages/**', 'client/Assets/Analyzers/**', 'client/Assets/**/*.ruleset') }}-${{ github.sha }}
          restore-keys: |
            client-tests-${{ matrix.mode }}-${{ env.UNITY_VERSION }}-${{ hashFiles('client/Packages/**', 'client/Assets/Analyzers/**', 'client/Assets/**/*.ruleset') }}-
      - name: Run Unity tests
        uses: game-ci/unity-test-runner@32e57712352b500e17974b245a6dce9e11a73213 # v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: client
          cliVersion: v0.1.55
          customImage: unityci/editor:${{ env.UNITY_VERSION }}-base-3
          testMode: ${{ matrix.mode }}
          customParameters: -assemblyNames ${{ matrix.assembly }}
          artifactsPath: client/TestResults/${{ matrix.mode }}
          coverageEnabled: false
          githubToken: ''
      - name: Require executed and passing tests
        run: python3 client/ci/verify-test-results.py client/TestResults/${{ matrix.mode }} ${{ matrix.assembly }}
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: client-tests-${{ matrix.mode }}
          path: client/TestResults/${{ matrix.mode }}
          if-no-files-found: ignore
          retention-days: 7

  web-build:
    name: Client Web build
    needs: [format, analyzers, tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check Unity prerequisites
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: bash client/ci/unity-preflight.sh
      - name: Restore Web Library
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: client/Library
          key: client-WebGL-${{ env.UNITY_VERSION }}-${{ hashFiles('client/Packages/**', 'client/Assets/Analyzers/**', 'client/Assets/**/*.ruleset') }}-${{ github.sha }}
          restore-keys: |
            client-WebGL-${{ env.UNITY_VERSION }}-${{ hashFiles('client/Packages/**', 'client/Assets/Analyzers/**', 'client/Assets/**/*.ruleset') }}-
      - name: Build Web player
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00 # v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: client
          unityVersion: ${{ env.UNITY_VERSION }}
          customImage: unityci/editor:${{ env.UNITY_VERSION }}-webgl-3
          targetPlatform: WebGL
          buildMethod: Baryonyx.Editor.CI.WebBuild.Build
          buildsPath: client/Builds
          buildName: Web
          versioning: None
      - name: Verify Web player files
        run: python3 client/ci/verify-web-build.py client/Builds/WebGL/Web
      - name: Upload Web player
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: client-web
          path: client/Builds/WebGL/Web
          if-no-files-found: error
          retention-days: 7
      - name: Upload Web build report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: client-web-build-report
          path: client/Logs/web-build.txt
          if-no-files-found: ignore
          retention-days: 7

