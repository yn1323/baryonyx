name: Client CI

on:
  push:
    branches:
      - main
    paths:
      - 'client/**'
      - '.github/workflows/client-ci.yml'
  pull_request:
    paths:
      - 'client/**'
      - '.github/workflows/client-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Client format (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: client/global.json
      - name: Restore CSharpier
        run: dotnet tool restore
      - name: Check C# formatting
        run: dotnet csharpier check Assets

  analyzers:
    name: Client analyzers
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check Unity prerequisites
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: bash client/ci/unity-preflight.sh
      - name: Restore Unity Library
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: client/Library
          key: client-Library-${{ runner.os }}-${{ env.UNITY_VERSION }}-${{ hashFiles('client/Packages/**', 'client/Assets/Analyzers/**', 'client/Assets/**/*.ruleset') }}-${{ github.sha }}
          restore-keys: |
            client-Library-${{ runner.os }}-${{ env.UNITY_VERSION }}-${{ hashFiles('client/Packages/**', 'client/Assets/Analyzers/**', 'client/Assets/**/*.ruleset') }}-
      - name: Prepare compiler report
        run: |
          # Cached PIDs belong to a previous container; Burst may kill a reused PID.
          rm -f -- client/Library/burst.pid client/Library/ilpp.pid
          mkdir -p client/Logs
          rm -f client/Logs/client-compile.txt
      - name: Compile Unity scripts and run analyzers
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00 # v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: client
          unityVersion: ${{ env.UNITY_VERSION }}
          customImage: unityci/editor:${{ env.UNITY_VERSION }}-base-3
          targetPlatform: StandaloneLinux64
          buildMethod: Baryonyx.Editor.CI.CompileCheck.Run
          manualExit: true
          customParameters: -nographics
          versioning: None
      - name: Verify compiler completion
        run: |
          grep -q '^BARYONYX_COMPILE_OK: ' client/Logs/client-compile.txt
      - name: Report runner resources after a failure
        if: failure()
        run: |
          free -m
          df -h
          sudo dmesg --level=err,warn | tail -n 40 || true
      - name: Upload compiler diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: client-compiler-diagnostics
          path: client/Logs/client-compile.txt
          if-no-files-found: ignore
          retention-days: 7

  tests:
    name: Client tests (${{ matrix.mode }})
    needs: analyzers
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - mode: editmode
            assembly: Baryonyx.EditModeTests
          - mode: playmode
            assembly: Baryonyx.PlayModeTests
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check Unity prerequisites
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: bash client/ci/unity-preflight.sh
      - name: Restore Unity Library
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: client/Library
          key: client-tests-linux-il2cpp-${{ matrix.mode }}-${{ env.UNITY_VERSION }}-${{ hashFiles('client/Packages/**', 'client/Assets/Analyzers/**', 'client/Assets/**/*.ruleset') }}-${{ github.sha }}
          restore-keys: |
            client-tests-linux-il2cpp-${{ matrix.mode }}-${{ env.UNITY_VERSION }}-${{ hashFiles('client/Packages/**', 'client/Assets/Analyzers/**', 'client/Assets/**/*.ruleset') }}-
      - name: Restore GameCI CLI
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/baryonyx-game-ci
          key: game-ci-cli-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('client/ci/run-unity-tests.sh') }}
      - name: Remove stale Unity process IDs
        run: rm -f -- client/Library/burst.pid client/Library/ilpp.pid
      - name: Run Unity tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: bash client/ci/run-unity-tests.sh ${{ matrix.mode }} ${{ matrix.assembly }}
      - name: Require executed and passing tests
        run: python3 client/ci/verify-test-results.py client/TestResults/${{ matrix.mode }} ${{ matrix.assembly }}
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: client-tests-${{ matrix.mode }}
          path: client/TestResults/${{ matrix.mode }}
          if-no-files-found: ignore
          retention-days: 7

  web-build:
    name: Client Web build
    needs: [format, analyzers, tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check Unity prerequisites
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: bash client/ci/unity-preflight.sh
      - name: Restore Web Library
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: client/Library
          key: client-WebGL-${{ env.UNITY_VERSION }}-${{ hashFiles('client/Packages/**', 'client/Assets/Analyzers/**', 'client/Assets/**/*.ruleset') }}-${{ github.sha }}
          restore-keys: |
            client-WebGL-${{ env.UNITY_VERSION }}-${{ hashFiles('client/Packages/**', 'client/Assets/Analyzers/**', 'client/Assets/**/*.ruleset') }}-
      - name: Remove stale Unity process IDs
        run: rm -f -- client/Library/burst.pid client/Library/ilpp.pid
      - name: Build Web player
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00 # v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: client
          unityVersion: ${{ env.UNITY_VERSION }}
          customImage: unityci/editor:${{ env.UNITY_VERSION }}-webgl-3
          targetPlatform: WebGL
          buildMethod: Baryonyx.Editor.CI.WebBuild.Build
          buildsPath: client/Builds
          buildName: Web
          versioning: None
      - name: Verify Web player files
        run: python3 client/ci/verify-web-build.py client/Builds/WebGL/Web
      - name: Upload Web player
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: client-web
          path: client/Builds/WebGL/Web
          if-no-files-found: error
          retention-days: 7
      - name: Upload Web build report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: client-web-build-report
          path: client/Logs/web-build.txt
          if-no-files-found: ignore
          retention-days: 7

  # 公開設定と検証スクリプトは、先にPRのbaseブランチへ反映する。
  # 詳細: doc/rules/client-testing-and-preview.md
  preview:
    name: Client PR Preview
    needs: web-build
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      preview-url: ${{ steps.deploy.outputs.deployment-url }}
    environment:
      name: client-preview
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - name: Checkout deployment helpers from the PR base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Check preview prerequisites
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ ! -f client/wrangler.jsonc ]]; then
            echo '::error::Merge client/wrangler.jsonc and the updated Web verifier into the PR base branch first.'
            exit 1
          fi
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done
      - name: Download Web player
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: client-web
          path: client/Builds/WebGL/Web
      - name: Check Cloudflare Static Assets limits
        run: python3 client/ci/verify-web-build.py client/Builds/WebGL/Web --cloudflare-limit
      - name: Set up Node.js for Wrangler
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - name: Upload PR Preview version
        id: deploy
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: client
          packageManager: npm
          wranglerVersion: '4.130.0'
          command: versions upload --config wrangler.jsonc --preview-alias pr-${{ github.event.pull_request.number }}
      - name: Require preview URL
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          if [[ -z "$PREVIEW_URL" ]]; then
            echo '::error::Cloudflare did not return a version preview URL. Enable Preview URLs for baryonyx-preview.'
            exit 1
          fi
          printf '### Client PR Preview\n\n[Open preview](%s)\n' "$PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"
