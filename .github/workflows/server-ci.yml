name: Server CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

# DB更新とPR終了時の削除が重ならないようにする。
concurrency:
  group: server-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Server checks
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: server/.node-version
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: server/package.json
          run_install: false
          cache: true
          cache_dependency_path: server/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint and format check
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Test Hono and D1 with Miniflare
        run: pnpm exec vitest run
      - name: Test deployment safeguards
        run: pnpm test:ci
      - name: Prepare deployment artifact
        run: node scripts/artifact.mjs
      - name: Upload deployment artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: server-worker
          path: |
            server/dist/index.js
            server/dist/index.js.map
            server/dist/build-info.json
            server/dist/migrations/*.sql
          if-no-files-found: error
          retention-days: 7

  preview:
    name: Server PR Preview
    needs: verify
    if: >-
      always() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action == 'closed' || needs.verify.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    environment:
      name: server-preview
      url: ${{ steps.deploy.outputs.url }}
    outputs:
      preview-url: ${{ steps.deploy.outputs.url }}
    defaults:
      run:
        working-directory: server
    steps:
      # 初回は公開ヘルパーをPRのbaseブランチへ先に反映する。
      - name: Checkout trusted deployment helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Require deployment helpers on the base branch
        run: |
          if [[ ! -f scripts/deploy.mjs ]]; then
            echo '::error::Merge the server D1 setup into the PR base branch before running Preview deployment.'
            exit 1
          fi
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: server/.node-version
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: server/package.json
          run_install: false
      - name: Install trusted deployment dependencies
        run: pnpm install --frozen-lockfile
      - name: Download tested Worker and migrations
        if: github.event.action != 'closed'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: server-worker
          path: server/.wrangler/artifact
      - name: Check whether the PR is still open
        id: pr
        if: github.event.action != 'closed'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          state=$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq .state)
          echo "state=$state" >> "$GITHUB_OUTPUT"
      - name: Deploy Preview and check HTTP and D1 connectivity
        id: deploy
        if: github.event.action != 'closed' && steps.pr.outputs.state == 'open'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SERVER_ARTIFACT_DIR: .wrangler/artifact
        run: node scripts/deploy.mjs deploy preview "$PR_NUMBER"
      - name: Remove closed PR Worker and D1
        if: github.event.action == 'closed'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/deploy.mjs cleanup preview "$PR_NUMBER"
